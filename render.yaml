
services:
  - type: web
    name: pranav-super-ai-bot-v3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        value: "8585055903"

      - key: ADMIN_PANEL_PASSWORD
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: BREVO_API_KEY
        sync: false

      - key: SENDER_EMAIL
        value: pranavsmmsuport@gmail.com

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: GEMINI_IMAGE_MODEL
        sync: false
